name: Docker Publish

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  BASE_BRANCH: develop
  FORK_SUFFIX: bin1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version metadata
        id: version
        run: bash .github/scripts/resolve-fork-version.sh "${FORK_SUFFIX}"

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RADARR_VERSION=${{ steps.version.outputs.release_version }}
            PACKAGE_VERSION=${{ steps.version.outputs.image_version }}
            PACKAGE_AUTHOR=${{ github.repository }}
            PACKAGE_BRANCH=${{ env.BASE_BRANCH }}
            PACKAGE_UPDATE_MESSAGE=Update this container by pulling a newer ghcr.io image from this fork.
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.image_version }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:latest-${{ env.FORK_SUFFIX }}

      - name: Create fork version tag
        env:
          FORK_TAG: ${{ steps.version.outputs.fork_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${FORK_TAG}" >/dev/null 2>&1; then
            echo "Git tag already exists: ${FORK_TAG}"
            exit 0
          fi

          git tag "${FORK_TAG}"
          git push origin "${FORK_TAG}"
