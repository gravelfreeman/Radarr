name: Upstream Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      base_branch:
        description: Fork stable branch to sync upstream into
        required: false
        default: main
        type: string
      fork_suffix:
        description: Suffix appended to published fork tags
        required: false
        default: bin1.1
        type: string
      upstream_repository:
        description: Upstream repository to sync from
        required: false
        default: Radarr/Radarr
        type: string
      upstream_tag:
        description: Optional upstream tag override
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.base_branch || 'main' }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Resolve workflow config
        id: config
        env:
          INPUT_BASE_BRANCH: ${{ github.event.inputs.base_branch }}
          INPUT_FORK_SUFFIX: ${{ github.event.inputs.fork_suffix }}
          INPUT_UPSTREAM_REPOSITORY: ${{ github.event.inputs.upstream_repository }}
        run: |
          echo "base_branch=${INPUT_BASE_BRANCH:-main}" >> "${GITHUB_OUTPUT}"
          echo "fork_suffix=${INPUT_FORK_SUFFIX:-bin1.1}" >> "${GITHUB_OUTPUT}"
          echo "upstream_repository=${INPUT_UPSTREAM_REPOSITORY:-Radarr/Radarr}" >> "${GITHUB_OUTPUT}"

      - name: Run upstream sync
        env:
          BASE_BRANCH: ${{ steps.config.outputs.base_branch }}
          FORK_SUFFIX: ${{ steps.config.outputs.fork_suffix }}
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream_repository }}
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          UPSTREAM_TAG_OVERRIDE: ${{ github.event.inputs.upstream_tag }}
        run: bash .github/scripts/sync-upstream.sh
